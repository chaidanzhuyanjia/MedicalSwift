name: iOS Simulator CI
on:
  push:
  pull_request:

jobs:
  simulator-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies -project MedicalSwift.xcodeproj -scheme MedicalSwiftRunner

      - name: Build for iOS Simulator
        run: |
          xcodebuild             -project MedicalSwift.xcodeproj             -scheme MedicalSwiftRunner             -configuration Debug             -sdk iphonesimulator             -destination 'generic/platform=iOS Simulator'             CODE_SIGNING_ALLOWED=NO             build
