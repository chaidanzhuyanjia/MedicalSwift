name: MedicalSwift
options:
  bundleIdPrefix: com.medicalswift
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  SwiftSyntax:
    url: https://github.com/swiftlang/swift-syntax.git
    from: 600.0.0
targets:
  MedicalSwiftCore:
    type: framework
    platform: iOS
    sources:
      - Sources/MedicalSwiftCore
    dependencies:
      - package: SwiftSyntax
        product: SwiftSyntax
      - package: SwiftSyntax
        product: SwiftParser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.medicalswift.core
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  MedicalSwiftRunner:
    type: application
    platform: iOS
    sources:
      - Sources/MedicalSwiftRunner
    dependencies:
      - target: MedicalSwiftCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.medicalswift.runner
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        CODE_SIGNING_ALLOWED: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
  MedicalSwiftRunnerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/MedicalSwiftRunnerUITests
    dependencies:
      - target: MedicalSwiftRunner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.medicalswift.runner.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  MedicalSwiftRunner:
    build:
      targets:
        MedicalSwiftRunner: all
        MedicalSwiftCore: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MedicalSwiftRunnerUITests
